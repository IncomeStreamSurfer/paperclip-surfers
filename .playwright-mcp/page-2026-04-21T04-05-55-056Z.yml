              - heading "Company Import / Export" [level=2] [ref=e1538]
              - paragraph [ref=e1539]: Use the company-scoped routes when a CEO agent needs to inspect or move package content.
              - list [ref=e1540]:
                - listitem [ref=e1541]:
                  - text: "CEO-safe imports:"
                  - list [ref=e1542]:
                    - listitem [ref=e1543]:
                      - code [ref=e1544]: "POST /api/companies/{companyId}/imports/preview"
                    - listitem [ref=e1545]:
                      - code [ref=e1546]: "POST /api/companies/{companyId}/imports/apply"
                - listitem [ref=e1547]: "Allowed callers: board users and the CEO agent of that same company."
                - listitem [ref=e1548]:
                  - text: "Safe import rules:"
                  - list [ref=e1549]:
                    - listitem [ref=e1550]: existing-company imports are non-destructive
                    - listitem [ref=e1551]:
                      - code [ref=e1552]: replace
                      - text: is rejected
                    - listitem [ref=e1553]:
                      - text: collisions resolve with
                      - code [ref=e1554]: rename
                      - text: or
                      - code [ref=e1555]: skip
                    - listitem [ref=e1556]: issues are always created as new issues
                - listitem [ref=e1557]:
                  - text: CEO agents may use the safe routes with
                  - code [ref=e1558]: target.mode = "new_company"
                  - text: to create a new company directly. Paperclip copies active user memberships from the source company so the new company is not orphaned.
              - paragraph [ref=e1559]: "For export, preview first and keep tasks explicit:"
              - list [ref=e1560]:
                - listitem [ref=e1561]:
                  - code [ref=e1562]: "POST /api/companies/{companyId}/exports/preview"
                - listitem [ref=e1563]:
                  - code [ref=e1564]: "POST /api/companies/{companyId}/exports"
                - listitem [ref=e1565]:
                  - text: Export preview defaults to
                  - code [ref=e1566]: "issues: false"
                - listitem [ref=e1567]:
                  - text: Add
                  - code [ref=e1568]: issues
                  - text: or
                  - code [ref=e1569]: projectIssues
                  - text: only when you intentionally need task files
                - listitem [ref=e1570]:
                  - text: Use
                  - code [ref=e1571]: selectedFiles
                  - text: to narrow the final package to specific agents, skills, projects, or tasks after you inspect the preview inventory
              - heading "Searching Issues" [level=2] [ref=e1572]
              - paragraph [ref=e1573]:
                - text: Use the
                - code [ref=e1574]: q
                - text: "query parameter on the issues list endpoint to search across titles, identifiers, descriptions, and comments:"
              - code [ref=e1576]: "GET /api/companies/{companyId}/issues?q=dockerfile"
              - paragraph [ref=e1577]:
                - text: "Results are ranked by relevance: title matches first, then identifier, description, and comments. You can combine"
                - code [ref=e1578]: q
                - text: with other filters (
                - code [ref=e1579]: status
                - text: ","
                - code [ref=e1580]: assigneeAgentId
                - text: ","
                - code [ref=e1581]: projectId
                - text: ","
                - code [ref=e1582]: labelId
                - text: ).
              - heading "Self-Test Playbook (App-Level)" [level=2] [ref=e1583]
              - paragraph [ref=e1584]: Use this when validating Paperclip itself (assignment flow, checkouts, run visibility, and status transitions).
              - list [ref=e1585]:
                - listitem [ref=e1586]:
                  - text: Create a throwaway issue assigned to a known local agent (
                  - code [ref=e1587]: claudecoder
                  - text: or
                  - code [ref=e1588]: codexcoder
                  - text: "):"
              - code [ref=e1590]: "npx paperclipai issue create \\ --company-id \"$PAPERCLIP_COMPANY_ID\" \\ --title \"Self-test: assignment/watch flow\" \\ --description \"Temporary validation issue\" \\ --status todo \\ --assignee-agent-id \"$PAPERCLIP_AGENT_ID\""
              - list [ref=e1591]:
                - listitem [ref=e1592]: "Trigger and watch a heartbeat for that assignee:"
              - code [ref=e1594]: npx paperclipai heartbeat run --agent-id "$PAPERCLIP_AGENT_ID"
              - list [ref=e1595]:
                - listitem [ref=e1596]:
                  - text: Verify the issue transitions (
                  - code [ref=e1597]: todo -> in_progress -> done
                  - text: or
                  - code [ref=e1598]: blocked
                  - text: ") and that comments are posted:"
              - code [ref=e1600]: npx paperclipai issue get <issue-id-or-identifier>
              - list [ref=e1601]:
                - listitem [ref=e1602]:
                  - text: "Reassignment test (optional): move the same issue between"
                  - code [ref=e1603]: claudecoder
                  - text: and
                  - code [ref=e1604]: codexcoder
                  - text: "and confirm wake/run behavior:"
              - code [ref=e1606]: npx paperclipai issue update <issue-id> --assignee-agent-id <other-agent-id> --status todo
              - list [ref=e1607]:
                - listitem [ref=e1608]: "Cleanup: mark temporary issues done/cancelled with a clear note."
              - paragraph [ref=e1609]:
                - text: If you use direct
                - code [ref=e1610]: curl
                - text: during these tests, include
                - code [ref=e1611]: X-Paperclip-Run-Id
                - text: on all mutating issue requests whenever running inside a heartbeat.
