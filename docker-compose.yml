services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://paperclip:paperclip@db:5432/paperclip
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
      HOME: /paperclip
      OLLAMA_HOST: "http://192.168.68.230:11434"
      # Tell Ollama to keep models loaded indefinitely (prevents timeout on first use)
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - paperclip-data:/paperclip
      - ${HOME}/.claude:/paperclip/.claude
      - ${HOME}:/home/ccasalicchio
      - ${HOME}/.config/opencode:/paperclip/.config/opencode
      - ${HOME}/.gemini:/paperclip/.gemini
      - ${HOME}/.codex:/paperclip/.codex
      - ${HOME}/.copilot:/paperclip/.copilot
      - /mnt/e:/mnt/e
      - /mnt/obsidian:/mnt/obsidian
      - /home/ccasalicchio/twenty-crm-mcp-server:/home/ccasalicchio/twenty-crm-mcp-server
      - /home/ccasalicchio/imagemagic-mcp:/home/ccasalicchio/imagemagic-mcp
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  paperclip-data:

networks:
  default: {}
